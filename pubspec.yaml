name: tanseiq
description: "A new Flutter project."
publish_to: "none"
version: 1.0.6+14

environment:
  sdk: ">=3.7.0"

dependencies:
  bloc: ^9.0.0
  live_log_care: ^2.2.0  # Redaction-safe logging facade (LiveLog + Dio interceptor + Bloc observer)
  # OTP / PIN input
  pinput: ^5.0.0

  cached_network_image: ^3.4.1
  device_info_plus: ^11.5.0
  dio: ^5.8.0+1
  dotted_decoration: ^2.0.0
  dropdown_button2: ^2.3.9
  file_picker: ^8.1.7
  firebase_core: ^4.5.0
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  syncfusion_flutter_pdfviewer: ^28.2.9
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.3
  flutter_styled_toast: ^2.2.1
  freezed: ^2.5.7
  freezed_annotation: ^2.4.1
  # geolocator: ^14.0.2
  get_it: ^7.6.7
  google_maps_flutter: ^2.10.0
  image_picker: ^1.2.1
  intl_phone_field: ^3.2.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  location: ^5.0.3
  lottie: ^3.1.2
  package_rename: ^1.10.0
  percent_indicator: ^4.2.5
  permission_handler: ^11.3.1
  pretty_dio_logger: ^1.4.0
  # Upper-bounded on purpose, against retrofit_generator 9.x:
  #   4.9.1 -> ParseErrorLogger.logError gained a 4th positional param, but the
  #            generator still emits a 3-arg call (.g.dart files stop compiling).
  #   4.9.2 -> added `Parser.DartMappable`, which the generator's switches do not
  #            cover (the build script itself stops compiling).
  # Lifting this bound requires retrofit_generator 10.x, which needs analyzer >=8
  # and therefore a freezed 2 -> 3 migration.
  retrofit: ">=4.6.0 <4.9.1"
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  intl: any
  intl_utils: ^2.8.7
  retrofit_generator: ^9.2.0

dependency_overrides:
  sky_engine:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: JF Flat
      fonts:
        - asset: assets/fonts/JF_Flat_Bold.ttf
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/theming

flutter_intl:
  enabled: true
